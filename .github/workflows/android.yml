name: Android build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  debug-universal:
    name: Debug APK (universal, for device QA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prebuild (Android)
        run: bunx expo prebuild --platform android --no-install
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anagonda-debug-universal
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  debug-arch:
    name: Debug APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prebuild (Android)
        run: bunx expo prebuild --platform android --no-install
      - name: Build debug APK (${{ matrix.abi }})
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=${{ matrix.abi }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anagonda-debug-${{ matrix.abi }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: Release (arm64 + legacy arm, minified)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prebuild (Android)
        run: bunx expo prebuild --platform android --no-install
      - name: Build release APK (arm64-v8a)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk /tmp/app-arm64.apk
      - name: Build release APK (armeabi-v7a)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk /tmp/app-arm.apk
      - name: Build release AAB (Play Store)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Collect release APKs
        run: |
          mkdir -p release-assets
          cp /tmp/app-arm64.apk release-assets/app-arm64-v8a.apk
          cp /tmp/app-arm.apk release-assets/app-armeabi-v7a.apk
          ls -lh release-assets
      - name: Upload AAB (Play Console, not in release)
        uses: actions/upload-artifact@v4
        with:
          name: anagonda-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          body: |
            Release build of Ana Gonda Calculator (minified, R8 + resource shrinking).
            - `app-arm64-v8a.apk` — for modern Android phones.
            - `app-armeabi-v7a.apk` — for older 32-bit devices.

            Source code for these binaries: https://github.com/ashik-maybe/anagonda-calculator-app/tree/${{ github.ref_name }}
            Licensed GPL-3.0-or-later. Signed with the debug key for now; a real
            keystore is needed before Play Store submission. The Play AAB is built
            as a workflow artifact and is not attached here.
          draft: false
          prerelease: true
